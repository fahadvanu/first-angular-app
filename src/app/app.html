<app-header />

<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-users
          [user]="user"
          [selected]="user.id === selectedUserId()"
          (select)="onUserSelect($event)"
        />
      </li>
    }
  </ul>
  @if (selectedUser) {
    <app-tasks [username]="selectedUser.name" [userId]="selectedUser.id" />
  } @else {
    <p id="fallback">Select a user to view their tasks.</p>
  }
</main>
